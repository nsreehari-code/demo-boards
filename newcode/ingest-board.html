<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingest1 Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
    }

    .ingest-standalone-shell {
      min-height: 100vh;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      box-sizing: border-box;
    }

    #ingestBoardRoot {
      width: min(28rem, calc(100vw - 32px));
      min-height: calc(100vh - 32px);
    }

    .lc-result h1 { font-size: 1rem; font-weight: 700; margin: 0.5rem 0 0.25rem; }
    .lc-result h2 { font-size: 0.9rem; font-weight: 700; margin: 0.5rem 0 0.25rem; border-bottom: 1px solid #dee2e6; padding-bottom: 0.1rem; }
    .lc-result h3 { font-size: 0.85rem; font-weight: 600; margin: 0.4rem 0 0.2rem; }
    .lc-result p { font-size: 0.8rem; margin: 0 0 0.25rem; }
    .lc-result ul, .lc-result ol { font-size: 0.8rem; margin: 0 0 0.25rem; padding-left: 1.2rem; }
    .lc-result li { margin-bottom: 0.15rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leader-line/leader-line.min.js"></script>
  <script src="../node_modules/yaml-flow/browser/live-cards.js"></script>
  <script src="../node_modules/yaml-flow/browser/board-livecards-client.js"></script>
  <script defer src="./ingest-board.js"></script>
</head>
<body class="bg-light">
  <div class="ingest-standalone-shell">
    <div
      id="ingestBoardRoot"
      data-ingest-board-root
      data-server-config="../demo-board/server-config.json"
      data-canvas-height="100%"
    >Loading ingest board...</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var boardId = params.get('boardId') || 'ingest1';
      var root = document.getElementById('ingestBoardRoot');
      document.title = boardId + ' Board';
      root.dataset.boardId = boardId;
    })();
  </script>
</body>
</html>
