<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Boards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* Fixed overlay header */
    #topBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1050;
      background: rgba(248, 249, 250, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding: 0.5rem 1rem;
    }
    #pageShell {
      position: relative;
      box-sizing: border-box;
      height: 100dvh;
      padding-top: 56px;
      overflow: hidden;
    }
    #boardRoot {
      height: calc(100dvh - 56px);
      min-width: 0;
      min-height: 0;
      overflow: auto;
    }
    #ingestBoardRoot {
      display: none;
      position: fixed;
      top: 72px;
      left: 12px;
      width: auto;
      height: calc(100dvh - 84px);
      z-index: 1040;
      pointer-events: none;
    }

    /* Scale down markdown headings inside cards to stay in proportion with card body text */
    .lc-result h1 { font-size: 1rem;   font-weight: 700; margin: 0.5rem 0 0.25rem; }
    .lc-result h2 { font-size: 0.9rem; font-weight: 700; margin: 0.5rem 0 0.25rem; border-bottom: 1px solid #dee2e6; padding-bottom: 0.1rem; }
    .lc-result h3 { font-size: 0.85rem; font-weight: 600; margin: 0.4rem 0 0.2rem; }
    .lc-result p  { font-size: 0.8rem; margin: 0 0 0.25rem; }
    .lc-result ul, .lc-result ol { font-size: 0.8rem; margin: 0 0 0.25rem; padding-left: 1.2rem; }
    .lc-result li { margin-bottom: 0.15rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leader-line/leader-line.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/yaml-flow@8.3.0/browser/live-cards.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/yaml-flow@8.3.0/browser/board-livecards-client.js"></script>
  <script src="./js/board-livecards-host.js"></script>
  <script src="./js/board-livecards-stateful-host.js"></script>
  <script src="./js/ingest-board-package.js"></script>
  <script src="./js/client-ui-wiring.js"></script>
</head>
<body class="bg-light">
  <div id="topBar" class="d-flex flex-wrap align-items-center justify-content-between gap-2">
    <div>
      <h1 class="h5 mb-0" id="boardTitle">Live Boards</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
      <select id="boardKeySelect" class="form-select form-select-sm" style="width: auto;"></select>
      <div class="btn-group btn-group-sm" role="group" aria-label="View mode">
        <button class="btn btn-outline-primary active" id="modeBoard">Board</button>
        <button class="btn btn-outline-primary" id="modeCanvas">Canvas</button>
      </div>
      <button class="btn btn-sm btn-outline-secondary" id="autoLayout">Auto Layout</button>
      <div class="form-check ms-2">
        <input class="form-check-input" type="checkbox" id="devModeToggle" />
        <label class="form-check-label small" for="devModeToggle">Dev</label>
      </div>
    </div>
  </div>

  <div id="pageShell">
    <div id="boardRoot">
      <div class="container-fluid">
        <div class="d-flex align-items-center justify-content-center" style="height: 90vh;">
          <div class="text-center">
            <div class="spinner-border mb-3" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted">Initializing board...</p>
          </div>
        </div>
      </div>
    </div>
    <aside id="ingestBoardRoot" aria-label="Ingest board"></aside>
  </div>

  <script>
    (function () {
      var titleEl = document.getElementById('boardTitle');
      var boardSelectEl = document.getElementById('boardKeySelect');
      var modeBoardBtn = document.getElementById('modeBoard');
      var modeCanvasBtn = document.getElementById('modeCanvas');
      var autoLayoutBtn = document.getElementById('autoLayout');
      var devModeToggle = document.getElementById('devModeToggle');
      var initialBoardId = new URLSearchParams(window.location.search).get('l') || '';
      var wiring = null;

      function syncModeButtons(mode) {
        modeBoardBtn.classList.toggle('active', mode === 'board');
        modeCanvasBtn.classList.toggle('active', mode === 'canvas');
      }

      window.ClientUiWiring.init(
        window.BoardLivecardsHost,
        [
          {
            name: 'ingestRail',
            BoardModule: window.IngestBoardPackage,
            mountElement: document.getElementById('ingestBoardRoot'),
            shouldMount: function (ctx) {
              var firstBoard = Object.keys(((ctx.serverConfig || {}).boards) || {})[0];
              return ctx.activeBoardId === firstBoard;
            },
            filter: function (model) {
              return !!(model && model.card && model.card.meta && model.card.meta.ingest === true);
            },
            mode: 'board',
            canvas: { height: '100%', overflow: 'auto' }
          }
        ],
        {
          initialBoardId: initialBoardId,
          serverConfigPath: '../server-config.json',
          mounts: {
            mainBoard: document.getElementById('boardRoot')
          }
        }
      ).then(function (api) {
        wiring = api;

        syncModeButtons(wiring.getCurrentMode());
        devModeToggle.checked = wiring.getDevMode();

        wiring.onBoardChanged(function (evt) {
          titleEl.textContent = evt.board ? evt.board.label : evt.boardId;
          boardSelectEl.innerHTML = '';
          evt.boards.forEach(function (board) {
            var opt = document.createElement('option');
            opt.value = board.id;
            opt.textContent = board.label;
            opt.selected = board.id === evt.boardId;
            boardSelectEl.appendChild(opt);
          });
        });

        boardSelectEl.addEventListener('change', function () {
          wiring.switchBoard(this.value);
        });

        modeBoardBtn.addEventListener('click', function () {
          wiring.setMode('board');
          syncModeButtons('board');
        });

        modeCanvasBtn.addEventListener('click', function () {
          wiring.setMode('canvas');
          syncModeButtons('canvas');
        });

        autoLayoutBtn.addEventListener('click', function () {
          wiring.autoLayout();
        });

        devModeToggle.addEventListener('change', function () {
          wiring.setDevMode(this.checked);
        });
      });

      window.addEventListener('beforeunload', function () {
        if (wiring) {
          wiring.dispose();
        }
      });
    })();
  </script>
</body>
</html>
