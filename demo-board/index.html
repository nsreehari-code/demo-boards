<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Boards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    /* Fixed overlay header */
    #topBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1050;
      background: rgba(248, 249, 250, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding: 0.5rem 1rem;
    }
    /* Push content below the fixed header */
    #boardRoot { padding-top: 56px; min-height: 100vh; }

    /* Scale down markdown headings inside cards to stay in proportion with card body text */
    .lc-result h1 { font-size: 1rem;   font-weight: 700; margin: 0.5rem 0 0.25rem; }
    .lc-result h2 { font-size: 0.9rem; font-weight: 700; margin: 0.5rem 0 0.25rem; border-bottom: 1px solid #dee2e6; padding-bottom: 0.1rem; }
    .lc-result h3 { font-size: 0.85rem; font-weight: 600; margin: 0.4rem 0 0.2rem; }
    .lc-result p  { font-size: 0.8rem; margin: 0 0 0.25rem; }
    .lc-result ul, .lc-result ol { font-size: 0.8rem; margin: 0 0 0.25rem; padding-left: 1.2rem; }
    .lc-result li { margin-bottom: 0.15rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leader-line/leader-line.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/yaml-flow@8.0.5/browser/live-cards.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/yaml-flow@8.0.5/browser/board-livecards-client.js"></script>
</head>
<body class="bg-light">
  <div id="topBar" class="d-flex flex-wrap align-items-center justify-content-between gap-2">
    <div>
      <h1 class="h5 mb-0" id="boardTitle">Live Boards</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
      <select id="boardKeySelect" class="form-select form-select-sm" style="width: auto;"></select>
      <div class="btn-group btn-group-sm" role="group" aria-label="View mode">
        <button class="btn btn-outline-primary active" id="modeBoard">Board</button>
        <button class="btn btn-outline-primary" id="modeCanvas">Canvas</button>
      </div>
      <button class="btn btn-sm btn-outline-secondary" id="autoLayout">Auto Layout</button>
      <div class="form-check ms-2">
        <input class="form-check-input" type="checkbox" id="devModeToggle" />
        <label class="form-check-label small" for="devModeToggle">Dev</label>
      </div>
    </div>
  </div>

  <div id="boardRoot">
    <div class="container-fluid">
      <div class="d-flex align-items-center justify-content-center" style="height: 90vh;">
        <div class="text-center">
          <div class="spinner-border mb-3" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="text-muted">Initializing board...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var createBoardRuntimeClient = window.BoardLiveCardsClient && window.BoardLiveCardsClient.createBoardRuntimeClient;
      var defaultBoardPaths = window.BoardLiveCardsClient && window.BoardLiveCardsClient.defaultBoardPaths;
      if (!createBoardRuntimeClient || !defaultBoardPaths) {
        document.getElementById('boardRoot').innerHTML =
          '<div class="alert alert-danger">board-livecards-client.js not loaded.</div>';
        throw new Error('BoardLiveCardsClient not loaded');
      }

      var currentMode = localStorage.getItem('demo-board-mode') || 'board';
      var devMode = localStorage.getItem('demo-board-devmode') === 'true';
      var bootstrapCompleted = false;
      var activeBoardId = new URLSearchParams(window.location.search).get('l') || '';
      var runtimeClient = null;
      var activeServerOrigin = null;
      var serverConfig = null;

      // ── Load server-config.json to discover port + boards ──

      async function loadServerConfig() {
        var res = await fetch('server-config.json');
        if (!res.ok) throw new Error('Failed to fetch server-config.json: ' + res.status);
        serverConfig = await res.json();
        return serverConfig;
      }

      function serverOriginFromConfig() {
        var port = serverConfig && serverConfig.port || 7799;
        var hostPref = window.location.hostname === 'localhost' ? 'localhost' : '127.0.0.1';
        return 'http://' + hostPref + ':' + port;
      }

      // ── Server communication ──

      function boardPaths(boardId) {
        return defaultBoardPaths(boardId || activeBoardId || 'default');
      }

      async function fetchServer(path, init) {
        if (!activeServerOrigin) {
          activeServerOrigin = serverOriginFromConfig();
        }
        var url = activeServerOrigin + path;
        try {
          var res = await fetch(url, init);
          return res;
        } catch (err) {
          // Retry alternate host
          var alt = activeServerOrigin.includes('localhost')
            ? activeServerOrigin.replace('localhost', '127.0.0.1')
            : activeServerOrigin.replace('127.0.0.1', 'localhost');
          try {
            var res2 = await fetch(alt + path, init);
            activeServerOrigin = alt;
            return res2;
          } catch (err2) {
            throw new Error('Cannot reach server at ' + activeServerOrigin + ' or ' + alt + '. Is demo-server.js running?');
          }
        }
      }

      // ── Register boards from config and populate selector ──

      async function registerAndLoadBoards() {
        var boards = serverConfig && serverConfig.boards || {};
        var entries = Object.entries(boards);
        if (!entries.length) return;

        // Register each board via POST /api/boards (idempotent — 409 if already exists)
        for (var _i = 0; _i < entries.length; _i++) {
          var key = entries[_i][0];
          var cfg = entries[_i][1];
          try {
            await fetchServer('/api/boards', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ id: key, label: cfg.label || key }),
            });
          } catch (e) { /* ignore — server may be unreachable for some boards */ }
        }

        // Default to first board if ?l= not set
        if (!activeBoardId) {
          activeBoardId = entries[0][0];
        }

        var select = document.getElementById('boardKeySelect');
        select.innerHTML = '';
        entries.forEach(function (entry) {
          var opt = document.createElement('option');
          opt.value = entry[0];
          opt.textContent = entry[1].label || entry[0];
          if (entry[0] === activeBoardId) opt.selected = true;
          select.appendChild(opt);
        });

        var match = entries.find(function (e) { return e[0] === activeBoardId; });
        if (match) {
          document.getElementById('boardTitle').textContent = match[1].label || match[0];
        }
      }

      // ── UI state helpers ──

      function syncModeButtons(mode) {
        document.getElementById('modeBoard').classList.toggle('active', mode === 'board');
        document.getElementById('modeCanvas').classList.toggle('active', mode === 'canvas');
      }
      syncModeButtons(currentMode);
      document.getElementById('devModeToggle').checked = devMode;

      // ── Bootstrap ──

      async function switchBoard(boardId) {
        if (boardId === activeBoardId && bootstrapCompleted) return;
        if (runtimeClient) runtimeClient.dispose();
        bootstrapCompleted = false;
        activeBoardId = boardId;
        document.getElementById('boardRoot').innerHTML =
          '<div class="d-flex align-items-center justify-content-center" style="height:90vh">'
          + '<div class="text-center"><div class="spinner-border mb-3" role="status">'
          + '<span class="visually-hidden">Loading...</span></div>'
          + '<p class="text-muted">Loading board...</p></div></div>';

        // Update URL without reload
        var url = new URL(window.location);
        url.searchParams.set('l', boardId);
        history.replaceState(null, '', url);

        // Update title
        var entries = Object.entries(serverConfig && serverConfig.boards || {});
        var match = entries.find(function (e) { return e[0] === boardId; });
        document.getElementById('boardTitle').textContent = match ? (match[1].label || match[0]) : boardId;

        await bootstrapBoard(boardId);
      }

      async function bootstrapBoard(boardId) {
        var bid = boardId || activeBoardId || 'default';

        runtimeClient = createBoardRuntimeClient({
          fetchServer: fetchServer,
          boardPaths: boardPaths,
          getServerOrigin: function () { return activeServerOrigin; },
          initialMode: currentMode,
          canvas: { height: 'calc(100vh - 56px)', overflow: 'auto' },
        });

        await runtimeClient.bootstrapBoard({
          boardId: bid,
          rootElement: document.getElementById('boardRoot'),
          mode: currentMode,
        });

        bootstrapCompleted = true;
        if (devMode) runtimeClient.setDevMode(true);
      }

      // ── Event listeners ──

      document.getElementById('boardKeySelect').addEventListener('change', function () {
        switchBoard(this.value).catch(function (err) {
          console.error(err);
          document.getElementById('boardRoot').innerHTML =
            '<div class="alert alert-danger">Failed to switch board: ' + String(err && err.message || err) + '</div>';
        });
      });

      document.getElementById('modeBoard').addEventListener('click', function () {
        currentMode = 'board';
        localStorage.setItem('demo-board-mode', 'board');
        syncModeButtons('board');
        if (runtimeClient) runtimeClient.setMode('board');
      });

      document.getElementById('modeCanvas').addEventListener('click', function () {
        currentMode = 'canvas';
        localStorage.setItem('demo-board-mode', 'canvas');
        syncModeButtons('canvas');
        if (runtimeClient) runtimeClient.setMode('canvas');
      });

      document.getElementById('autoLayout').addEventListener('click', function () {
        if (runtimeClient) runtimeClient.autoLayout();
      });

      document.getElementById('devModeToggle').addEventListener('change', function () {
        devMode = this.checked;
        localStorage.setItem('demo-board-devmode', String(devMode));
        if (runtimeClient) runtimeClient.setDevMode(devMode);
      });

      // ── Start ──

      loadServerConfig()
        .then(function () { return registerAndLoadBoards(); })
        .then(function () { return bootstrapBoard(activeBoardId); })
        .catch(function (err) {
          console.error(err);
          document.getElementById('boardRoot').innerHTML =
            '<div class="alert alert-danger">Failed to start: ' + String(err && err.message || err) + '</div>';
        });

      window.addEventListener('beforeunload', function () {
        if (runtimeClient) runtimeClient.dispose();
      });
    })();
  </script>
</body>
</html>
