name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'demo-board/web/vite/**'
      - 'demo-board/server-config.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-board/web/vite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo-board/web/vite/package-lock.json

      - run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /demo-boards/
          VITE_SERVER_ORIGIN: http://localhost:7799
        run: npm run build

      - name: Add .nojekyll
        run: touch ../dist-vite/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-board/dist-vite

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
